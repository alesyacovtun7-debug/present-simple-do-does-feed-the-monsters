<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Present Simple do/does? | GURU</title><style>*{box-sizing:border-box}body{margin:0;background:#f5efff;color:#35245b;font:700 19px system-ui;text-align:center}main{max-width:850px;margin:auto;padding:24px}h1{font-size:clamp(30px,6vw,56px);margin:8px;color:#673ab7}p{margin:10px}.stats{display:flex;justify-content:space-between;background:white;border-radius:18px;padding:15px}.track{height:12px;background:#e1d5f6;border-radius:20px;margin:16px 0;overflow:hidden}#bar{height:100%;background:#8b5cf6;transition:width .3s}.word{display:inline-block;background:white;border:3px dashed #a78bfa;border-radius:20px;padding:20px 40px;font-size:32px;cursor:grab;touch-action:manipulation;margin:15px}.monsters{display:grid;grid-template-columns:1fr 1fr;gap:16px}.monster{border:0;border-radius:30px;background:#dbeafe;cursor:pointer;padding:15px;color:#2055a0;box-shadow:0 6px 0 #a5c8f8;font:inherit}.monster:nth-child(2){background:#fce7f3;color:#a52670;box-shadow:0 6px 0 #f5acd1}.monster:hover,.monster:focus-visible{transform:translateY(-4px);outline:3px solid #9b75e9}.monster svg{width:100%;max-width:190px;display:block;margin:auto}.monster strong{font-size:35px}.happy{animation:bounce .45s}.sad{animation:shake .35s}@keyframes bounce{50%{transform:scale(1.08) translateY(-10px)}}@keyframes shake{25%,75%{transform:translateX(-8px)}50%{transform:translateX(8px)}}#feedback{min-height:52px;padding:12px}button#reset{background:#7145c5;color:white;border:0;border-radius:14px;padding:12px 24px;font:inherit;cursor:pointer}.small{font-size:14px;opacity:.75}.fed{font-size:14px;min-height:24px;overflow-wrap:anywhere}@media(max-width:450px){main{padding:12px}.monster{padding:8px}.word{font-size:26px}.stats{font-size:15px}}</style><main><div class="small">GURU • PRESENT SIMPLE</div><h1>Present Simple do/does?</h1><p>Drag the word to a monster or tap the correct monster.</p><div class="stats"><span id="score">⭐ 0 points</span><span id="count">0 / 12</span></div><div class="track"><div id="bar"></div></div><div id="word" class="word" draggable="true"></div><div class="monsters" id="monsters"></div><div id="feedback" aria-live="polite">Who's hungry?</div><button id="reset">Play again ↻</button></main><script>const data=[['I','DO'],['Emma','DOES'],['They','DO'],['He','DOES'],['You','DO'],['Mia','DOES'],['We','DO'],['She','DOES'],['Tom','DOES'],['My friends','DO'],['My sister','DOES'],['My parents','DO']];const $=id=>document.getElementById(id);let deck,i,points,miss,busy;for(const [name,color] of [['DO','#60a5fa'],['DOES','#f472b6']]){let b=document.createElement('button');b.className='monster';b.id=name;b.innerHTML=`<svg viewBox="0 0 160 135" aria-hidden="true"><path d="M30 48 L23 10 L58 33 Q80 20 102 33 L137 10 L130 48 Q153 110 104 121 L56 121 Q7 110 30 48" fill="${color}"/><ellipse cx="57" cy="55" rx="18" ry="22" fill="white"/><ellipse cx="103" cy="55" rx="18" ry="22" fill="white"/><circle cx="60" cy="59" r="8" fill="#28203b"/><circle cx="100" cy="59" r="8" fill="#28203b"/><path d="M46 85 Q80 72 114 85 Q109 116 80 116 Q51 116 46 85" fill="#28203b"/><path d="M55 82 L72 80 L70 94 L57 94 Z M88 80 L105 82 L103 94 L90 94 Z" fill="white"/></svg><strong>${name}</strong><div class="fed" id="fed${name}"></div>`;b.onclick=()=>feed(name);b.ondragover=e=>e.preventDefault();b.ondrop=e=>{e.preventDefault();feed(name)};$('monsters').append(b)}$('word').ondragstart=e=>e.dataTransfer.setData('text/plain',$('word').textContent);function show(){$('score').textContent='⭐ '+points+' points';$('count').textContent=i+' / '+deck.length;$('bar').style.width=i/deck.length*100+'%';$('word').textContent=i<deck.length?deck[i][0]:'🎉 All fed!';$('word').draggable=i<deck.length;for(let n of ['DO','DOES'])$(n).disabled=i>=deck.length}function feed(n){if(busy||i>=deck.length)return;let b=$(n);b.classList.remove('happy','sad');void b.offsetWidth;if(deck[i][1]!==n){miss=true;b.classList.add('sad');$('feedback').textContent='Oops! That monster is not hungry for this word. Try again!';return}b.classList.add('happy');points+=miss?5:10;miss=false;$('fed'+n).textContent+=($('fed'+n).textContent?' · ':'')+deck[i][0];i++;show();$('feedback').textContent=i===deck.length?'🏆 Amazing! Final score: '+points+' / 120':'Yummy! Great job! ✨'}function start(){deck=data.map(x=>x.slice());for(let j=deck.length-1;j>0;j--){let k=Math.floor(Math.random()*(j+1));[deck[j],deck[k]]=[deck[k],deck[j]]}i=0;points=0;miss=false;busy=false;for(let n of ['DO','DOES'])$('fed'+n).textContent='';$('feedback').textContent='Who’s hungry?';show()}$('reset').onclick=start;start();</script></html>
